<style>
/* Base: the Perk look (warm stone page, white rounded cards, lime fills, pill buttons, big tight headlines).
   Added from Sri Lanka sites: hero checklist + guest videos + travel basics (Ceylon Shen), tour cards with night badge + how it works (Look Lanka),
   price chips + trust facts on cards (BookLanka), big stat numbers + stage map (Pekoe Trail). */
:root{
  color-scheme:light;
  --page:#F5F5EB; --card:#FFFFFF; --tint:rgba(25,25,15,.05); --line:rgba(25,25,15,.1); --sand:#D2D2C8;
  --ink:#14140F; --mute:#6E6E64; --lime:#BEFF50; --lime-2:#D6FF8F; --forest:#2F4A2A; --clay:#A4472A;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:400 17px/1.55 var(--f);-webkit-font-smoothing:antialiased}
::selection{background:var(--lime);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums lining-nums}
.mute{color:var(--mute)}
.sec{padding-block:110px 0}
/* white bands for recommended sections (Perk): full-width white, cards inside turn stone */
.sec.white{background:var(--card);padding-block:100px;margin-top:110px}
.sec.white.join{margin-top:0;padding-top:20px}
.sec.white+.sec:not(.white){padding-top:110px}
.white .c4,.white .tc,.white .bx,.white .vid,.white .mate{background:var(--page)}
.white .tc .badge{background:var(--card)}
.center{text-align:center}
.h2{font-size:clamp(36px,4.2vw,60px);line-height:1}
.lead{font-size:18px;color:var(--mute);max-width:56ch;margin-top:18px}
.center .lead{margin-inline:auto}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.center .cta-row{justify-content:center}

/* nav: floating white bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--page);z-index:30}
/* Menu like Perk: flat and part of the hero at the top; a floating stone bar after scrolling */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:0;transition:padding .25s cubic-bezier(.2,.7,.1,1)}
.bar-nav{display:flex;align-items:center;gap:8px;background:var(--page);border-radius:0;padding:14px 0;margin-inline:0;box-shadow:none;
 transition:border-radius .25s cubic-bezier(.2,.7,.1,1),padding .25s cubic-bezier(.2,.7,.1,1),margin .25s cubic-bezier(.2,.7,.1,1),box-shadow .25s cubic-bezier(.2,.7,.1,1)}
header.top.scrolled{padding-top:10px}
header.top.scrolled .bar-nav{border-radius:28px;padding:8px 8px 8px 20px;margin-inline:-12px;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(25,25,15,.08)}
/* phones and tablets: more space in the top bar */
@media(max-width:959px){.bar-nav{padding:24px 8px 24px 0}header.top.scrolled .bar-nav{padding:12px 16px 12px 22px}}
.mark{display:flex;align-items:center;padding:4px 0}
.mark .lk{display:block;height:38px;width:auto}
@media(max-width:430px){.mark .lk{height:28px}}
.links{display:none;gap:4px;margin-left:18px}
.links a{text-decoration:none;padding:10px 14px;border-radius:999px;font-size:16px}
.links a:hover{background:var(--tint)}
@media(min-width:960px){.links{display:flex}}
.grow{flex:1}
.cur{display:none;font-size:15px;color:var(--mute);padding:0 10px}
@media(min-width:720px){.cur{display:block}}
.steps{display:flex;gap:10px;align-items:center;justify-content:center;overflow-x:auto;white-space:nowrap;padding:10px 0 2px;font-size:13px;color:var(--mute)}
.steps i{width:18px;border-top:1px solid var(--sand)}
.steps .on{color:var(--ink);font-weight:500}
.steps .done::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:7px;vertical-align:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px 0 22px;border-radius:999px;font:500 16px/1 var(--f);white-space:nowrap;transition:background .25s,box-shadow .25s,transform .25s}
.btn svg{flex:0 0 auto}
.b-lime{background:var(--lime);color:var(--ink)} .b-lime:hover{background:var(--lime-2)}
.b-ol{box-shadow:inset 0 0 0 1px var(--ink)} .b-ol:hover{background:var(--tint)}
.b-ink{background:var(--ink);color:#fff} .b-ink:hover{background:#2B2B24}
.b-wh{background:#fff;color:var(--ink)}
.b-lg{min-height:54px;padding:0 22px 0 26px;font-size:17px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
@media(max-width:430px){.bar-nav .b-lime{padding:0 14px;font-size:15px}.mark{font-size:15px}}

/* hero */
.hero{padding-top:70px;text-align:center}
.hello{font:500 15px/1 "Noto Sans Sinhala",var(--f);color:var(--mute)}
.hero h1{font-size:clamp(42px,5.6vw,80px);line-height:.95;max-width:15ch;margin:18px auto 0}
.hero .path{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 10px;margin-top:16px;font-size:14px;color:var(--mute)}
.hero .path i{width:4px;height:4px;border-radius:50%;background:var(--sand);display:inline-block}
.hero .hsub{margin:20px auto 0;max-width:52ch;color:var(--mute)}
.checks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:26px;font-size:16px}
.checks span{display:inline-flex;align-items:center;gap:8px}
.stage{position:relative;margin-top:56px}
.stage .photo{border-radius:28px;overflow:hidden;position:relative}
.stage .photo video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--ink)}
@media(min-width:760px){.stage .photo video{aspect-ratio:16/8}}
.vp{position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:var(--ink)}
@media(max-width:759px){.vp{left:auto;right:16px}}
.ph{position:absolute;left:16px;top:16px;font-size:12px;background:rgba(20,20,15,.62);color:#fff;padding:6px 10px;border-radius:999px}
.phone{position:absolute;right:6%;bottom:-40px;width:236px;background:var(--ink);border-radius:38px;padding:8px;box-shadow:0 30px 60px rgba(20,20,15,.28)}
.phone .scr{background:var(--card);border-radius:31px;padding:26px 14px 16px;text-align:left;font-size:12px;display:grid;gap:9px}
.phone .notch{width:70px;height:20px;border-radius:12px;background:var(--ink);margin:-18px auto 4px}
.phone b{font-size:19px;font-weight:500;letter-spacing:-.02em}
.mini{display:flex;gap:8px;align-items:center;background:var(--page);border-radius:14px;padding:9px}
.mini .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;box-shadow:inset 0 0 0 1px var(--sand);flex:0 0 auto}
.mini .d.v{background:var(--lime);box-shadow:none}
.mini small{display:block;color:var(--mute);font-size:10.5px}
.phone .go{background:var(--lime);border-radius:999px;text-align:center;padding:9px;font-weight:500}
.lcard{position:absolute;left:5%;bottom:-34px;width:280px;background:var(--lime);border-radius:22px;padding:18px 20px;text-align:left;box-shadow:0 24px 50px rgba(20,20,15,.18)}
.lcard .t{font-size:13px}
.lcard .p{font:500 30px/1 var(--f);letter-spacing:-.03em;margin-top:10px}
.lcard small{display:block;font-size:12.5px;margin-top:8px}
@media(max-width:759px){.lcard{display:none}.phone{left:50%;right:auto;transform:translateX(-50%);bottom:-70px;width:220px}}

/* places strip under hero */
.where{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;margin-top:96px;color:var(--mute);font-size:15px}
@media(max-width:759px){.where{margin-top:120px}}
.where b{color:var(--ink);font-weight:500}

/* stats + cards */
.big-stat{font-size:clamp(36px,4.2vw,60px);line-height:1}
.big-stat sup{font-size:.4em;vertical-align:.9em}
.cards4{display:grid;gap:14px;margin-top:56px}
@media(min-width:700px){.cards4{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.cards4{grid-template-columns:repeat(4,1fr)}}
.c4{background:var(--card);border-radius:26px;padding:26px;display:grid;gap:12px;align-content:start}
@media(min-width:1100px){.c4{min-height:250px}}
.c4 .ic{width:44px;height:44px;border-radius:14px;background:var(--lime);display:grid;place-items:center}
.c4 h3{font-size:24px;margin-top:22px}
.c4 p{color:var(--mute);font-size:15.5px}

/* vibe accordion (Perk role accordion) */
.acc{margin-top:56px;background:var(--card);border-radius:28px;padding:10px;display:grid;gap:8px}
.arow{border-radius:20px;background:var(--tint);overflow:hidden}
.arow>button{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;text-align:left}
.arow>button .nm{font:500 20px/1 var(--f);letter-spacing:-.02em;min-width:9ch}
.arow>button small{color:var(--mute);font-size:15px;flex:1}
.arow>button .strip{display:none;width:38%;height:34px;border-radius:12px;overflow:hidden}
.arow>button .strip img{width:100%;height:100%;object-fit:cover}
@media(min-width:760px){.arow>button .strip{display:block}}
.arow.open{background:var(--page)}
.arow.open>button .strip{display:none}
.abody{display:grid;gap:18px;padding:0 18px 18px}
@media(min-width:900px){.abody{grid-template-columns:1fr 1.25fr;gap:28px;align-items:stretch}}
.abody .img{border-radius:18px;overflow:hidden;min-height:280px;position:relative}
.abody .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mom{display:grid;gap:4px;padding-block:14px;border-top:1px solid var(--line)}
.mom:first-child{border-top:0;padding-top:4px}
.mom h3{font-size:22px;letter-spacing:-.025em}
.mom .real{color:var(--mute);font-size:15.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mute);margin-top:2px}
.facts span{display:inline-flex;gap:6px;align-items:center}

/* trip cards (Look Lanka / Ceylon Shen) */
.cards{display:grid;gap:14px;margin-top:50px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.cards{grid-template-columns:repeat(4,1fr)}}
.tc{background:var(--card);border-radius:26px;padding:8px;display:flex;flex-direction:column}
.tc .img{position:relative;border-radius:20px;overflow:hidden}
.tc .img img{width:100%;aspect-ratio:4/3;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.chipp{position:absolute;left:10px;top:10px;background:var(--lime);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.tc .in{padding:16px 12px 10px;display:grid;gap:10px;flex:1;align-content:start}
.tc h3{font-size:24px}
.tc .stops{color:var(--mute);font-size:15px}
.tc .foot{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:auto;padding:14px 12px 8px;border-top:1px solid var(--line)}
.tc .price{font:500 24px/1 var(--f);letter-spacing:-.02em}
.tc .price small{display:block;font:400 12.5px var(--f);color:var(--mute);margin-top:6px;letter-spacing:0}
.rbtn{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.rbtn:hover{background:var(--forest)}

/* split section */
.split{display:grid;gap:30px;align-items:center}
@media(min-width:960px){.split{grid-template-columns:1fr 1.05fr;gap:60px}}
.panelcard{background:var(--card);border-radius:28px;padding:28px}
.ruled{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;color:inherit;font-size:16px}
.ruled td{padding:14px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.ruled td:last-child{text-align:right;white-space:nowrap}
.ruled small{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.ruled tr.t td{border:0;font:500 24px/1 var(--f);letter-spacing:-.02em;padding:18px 16px;background:var(--lime)}
.ruled tr.t td:first-child{border-radius:16px 0 0 16px}
.ruled tr.t td:last-child{border-radius:0 16px 16px 0}
.note{font-size:13px;color:var(--mute);margin-top:12px}

/* never / always */
.na{display:grid;gap:14px;margin-top:50px}
@media(min-width:900px){.na{grid-template-columns:1fr 1fr}}
.na>div{background:var(--card);border-radius:26px;padding:28px}
.na h3{font-size:28px}
.na ul{list-style:none;padding:0;margin:16px 0 0;display:grid}
.na li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding-block:13px;border-top:1px solid var(--line);align-items:center}

/* guest videos (Ceylon Shen) */
.vids{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:50px;padding-bottom:6px}
.vid{flex:0 0 min(72%,290px);scroll-snap-align:start;background:var(--card);border-radius:26px;padding:8px;display:grid;gap:10px}
.vid .v{position:relative;aspect-ratio:9/14;border-radius:20px;overflow:hidden;background:var(--ink)}
.vid .v img{width:100%;height:100%;object-fit:cover;opacity:.82}
.play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.vid .cap{padding:4px 10px 10px;font-size:14.5px}
.vid .cap b{font-weight:500;display:block}
.vid .cap span{color:var(--mute)}

/* places marquee (Perk cities) */
.marq{overflow:hidden;margin-top:56px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;width:max-content;animation:slide 60s linear infinite}
.marq:hover .track{animation-play-state:paused}
.track .row{display:flex;align-items:center;gap:22px;padding-right:22px}
.track b{font:500 clamp(48px,6.25vw,90px)/1.1 var(--f);letter-spacing:-.04em;white-space:nowrap}
.track img{width:clamp(70px,8vw,110px);height:clamp(52px,6vw,78px);object-fit:cover;border-radius:16px}
@keyframes slide{to{transform:translateX(-50%)}}

/* basics + steps */
.grid2{display:grid;gap:14px;margin-top:50px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.bx{background:var(--card);border-radius:26px;padding:26px;display:grid;gap:8px}
.bx h3{font-size:22px}
.bx p{color:var(--mute);font-size:15.5px}
.how{display:grid;gap:14px;margin-top:50px}
@media(min-width:900px){.how{grid-template-columns:repeat(3,1fr)}}
.how .bx .n{width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:600;margin-bottom:14px}

/* crew band (Perk dark photo band) */
.band{position:relative;border-radius:28px;overflow:hidden;color:#fff;text-align:center;padding:120px 20px}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band::after{content:"";position:absolute;inset:0;background:rgba(20,20,15,.62)}
.band>div{position:relative;z-index:1}
.band h2{font-size:clamp(32px,3.6vw,52px);max-width:18ch;margin:0 auto}
.band p{max-width:52ch;margin:18px auto 0;color:#E8E8DE}
.band .cta-row{justify-content:center}
.crew{display:grid;gap:14px;margin-top:14px}
@media(min-width:900px){.crew{grid-template-columns:repeat(3,1fr)}}
.mate{background:var(--card);border-radius:26px;padding:8px 8px 18px;display:grid;gap:12px}
.mate .pic{aspect-ratio:4/3;border-radius:20px;background:var(--tint);display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:14px}
.mate b{font-weight:500;font-size:19px;padding:0 10px}
.mate p{color:var(--mute);font-size:15px;padding:0 10px}

/* lime footer */
footer.f{margin-top:110px;background:var(--lime);border-radius:28px 28px 0 0;padding:56px 0 calc(28px + env(safe-area-inset-bottom,0px));overflow:hidden}
.fcols{display:grid;gap:28px;grid-template-columns:1fr 1fr}
@media(min-width:900px){.fcols{grid-template-columns:repeat(4,1fr)}}
.fcols h4{margin:0 0 10px;font:500 15px var(--f)}
.fcols a,.fcols span{display:block;font-size:15px;padding-block:4px;text-decoration:none}
.fbig{margin:64px 0 26px}
.fbig .flk{display:block;width:100%;height:auto}
.fsmall{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13.5px;border-top:1px solid rgba(20,20,15,.2);padding-top:18px}

.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:24;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:5px 20px 5px 5px;min-height:56px;box-shadow:0 14px 30px rgba(20,20,15,.25);font-weight:500}
.wa .wak{position:relative;width:46px;height:46px;border-radius:50%;background:var(--page);flex:0 0 auto;display:block}
.wa .wak svg{display:block;width:100%;height:100%;border-radius:50%}
.wa .wab{position:absolute;right:-4px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--lime);color:#14140F;display:grid;place-items:center;box-shadow:0 0 0 2px var(--ink)}
.wa .wab svg{width:13px;height:13px}
.wa .wap{display:none}
.wa.plain .wak{display:none}
.wa.plain .wap{display:grid;width:46px;height:46px;place-items:center}
.wa small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:1px}
@media (prefers-reduced-motion: no-preference){.wa:hover .wak{animation:pop .45s cubic-bezier(.2,.7,.1,1)}}
@media(max-width:600px){.wa{padding:5px}.wa .wat{display:none}}
@media(max-width:999px){.wa.onbar{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
@media(min-width:1000px){.wa.onbar{display:none}}


/* package page */
.pkhead{padding-top:50px}
.pkhead h1{font-size:clamp(42px,5.6vw,80px);line-height:.95}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:30px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stats div{background:var(--card);border-radius:22px;padding:18px 20px}
.stats b{display:block;font:500 36px/1 var(--f);letter-spacing:-.03em}
.stats span{color:var(--mute);font-size:14px}
.pkgrid{display:grid;gap:14px;padding-block:14px 130px}
@media(min-width:1000px){.pkgrid{grid-template-columns:minmax(0,1fr) 410px;align-items:start;padding-bottom:80px}}
.mapbox{background:var(--card);border-radius:28px;padding:20px}
.mapbox svg{width:100%;height:auto;display:block;max-height:470px}
.mapbox.real{padding:8px}
.rm{height:min(64vh,500px);min-height:360px;border-radius:20px;overflow:hidden;background:#EEF1E6}
.legkm{color:var(--mute)}
.maplibregl-ctrl-attrib{font-family:var(--f)}
.stopbtn{cursor:pointer}
.days{background:var(--card);border-radius:28px;padding:8px 22px}
.day{padding-block:20px;border-bottom:1px solid var(--line);display:grid;gap:8px;transition:opacity .4s}
.day:last-child{border:0}
.day.dim{opacity:.3}
.day .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px}
.day .meta span{background:var(--page);border-radius:999px;padding:4px 10px}
.day .meta .eff{background:var(--lime)} .day .meta .eff.hard{background:#FFD9CC}
.day h3{font-size:clamp(22px,2.2vw,28px)}
.day details{color:var(--mute);font-size:15px}
.day summary{cursor:pointer;color:var(--ink);font-weight:500;list-style:none;font-size:15px}
.day summary::-webkit-details-marker{display:none}
.panel{display:none}
@media(min-width:1000px){.panel{display:block;position:sticky;top:110px;background:var(--card);border-radius:28px;padding:26px}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(20,20,15,.1);display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:1000px){.bar.pk{display:none}}
.bar .tot{white-space:nowrap;font:500 26px/1 var(--f);letter-spacing:-.02em}
.bar small{font-size:12.5px;color:var(--mute)}

.scrim{position:fixed;inset:0;background:rgba(20,20,15,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;
 padding:10px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));animation:rise .35s cubic-bezier(.2,.7,.1,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grip{width:44px;height:5px;border-radius:9px;background:var(--sand);margin:6px auto 16px}
.sheet h3,.panel h3{font-size:28px}
.fld{display:grid;gap:10px;padding-block:16px;border-bottom:1px solid var(--line)}
.lb{font:500 14px var(--f);color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 18px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--sand);font-size:15px}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.opt.r{width:44px;padding:0}
.stp{display:flex;align-items:center;gap:16px}
.stp button{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);font-size:20px}
.stp output{font:500 28px var(--f);min-width:24px;text-align:center}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{display:grid;gap:6px;text-align:left;padding:6px 6px 12px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--sand)}
.up img{aspect-ratio:4/3;object-fit:cover;width:100%;border-radius:13px}
.up b{font-weight:500;font-size:15px;padding:0 6px}
.up small{font-size:13px;color:var(--mute);padding:0 6px}
.up[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.up[aria-pressed="true"] small{color:#C9C9BE}
.check{display:flex;gap:12px;align-items:center}
.check input{width:20px;height:20px;accent-color:var(--ink)}
input[type=text],input[type=tel]{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--page);padding:0 16px;font:inherit;color:var(--ink)}
input::placeholder{color:var(--mute)}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dt{flex:0 0 66px;padding:10px 4px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--sand);display:grid;text-align:center;font-size:12px}
.dt b{font:500 22px var(--f)}
.dt[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:#fff;padding:14px 20px;border-radius:16px;max-width:90vw;font-size:15px;box-shadow:0 18px 40px rgba(0,0,0,.3)}

/* quiz */
.quiz{max-width:720px;margin:0 auto;padding:36px max(16px,env(safe-area-inset-right,0px)) 190px max(16px,env(safe-area-inset-left,0px));display:grid;gap:28px}
.qtop{display:flex;align-items:center;gap:14px}
.qtop button{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.bar2{flex:1;height:8px;border-radius:9px;background:var(--sand)}
.bar2 i{display:block;height:100%;border-radius:9px;background:var(--ink);transition:width .5s cubic-bezier(.2,.7,.1,1)}
.qq h2{font-size:clamp(24px,2.6vw,36px)}
.qq p{margin-top:10px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:108px;padding:16px;border-radius:22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);position:relative;transition:background .25s,color .25s}
.tile b{font-weight:500;font-size:17px;line-height:1.2}
.tile small{color:var(--mute);font-size:13px}
.tile[aria-pressed="true"]{background:var(--ink);color:#fff}
.tile[aria-pressed="true"] small{color:#C9C9BE}
.tile .rk{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:50px;min-height:50px;border-radius:50%;background:var(--card);font:500 19px var(--f)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.ql{font:500 14px var(--f);color:var(--mute);margin-bottom:-14px}
input[type=range]{width:100%;accent-color:var(--ink);height:30px}
.qfoot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(20,20,15,.08);
 padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qfoot .in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.sofar{justify-self:center;color:var(--mute);font-size:14px}
.qfoot .btn{width:100%}
.result{background:var(--ink);color:#fff;border-radius:28px;padding:28px;display:grid;gap:14px}
.result h2{font-size:clamp(32px,3.6vw,48px);color:var(--lime)}
.result .ruled tr.t td{color:var(--ink)}
.result .note{color:#C9C9BE}



/* Kotiya quiz teaser on the home page */
.kt{background:var(--lime);color:#14140F;border-radius:28px;padding:22px;display:grid;gap:22px;align-items:center}
@media(min-width:920px){.kt{grid-template-columns:1.15fr 1fr;padding:36px 40px;gap:40px}}
.ktl{display:flex;align-items:flex-end;gap:14px}
.ktleo{flex:0 0 auto;width:clamp(120px,24vw,200px);background:#F5F5EB;border-radius:24px;padding:10px}
.ktleo svg{display:block;width:100%;height:auto}
.ktb{background:#fff;border-radius:24px 24px 24px 6px;padding:18px 20px;min-width:0}
.ktb h2{font-size:clamp(24px,2.6vw,36px)}
.ktb p{margin-top:10px;font-size:16.5px;color:#3A3A32}
.ktr{display:grid;gap:14px}
.ktr .q{font:500 18px var(--f);letter-spacing:-.01em}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp div{background:#fff;border-radius:18px;padding:6px 6px 10px;text-align:center;font-size:13px;line-height:1.25;font-weight:500}
.kp svg{display:block;width:100%;height:auto;background:#F5F5EB;border-radius:13px;margin-bottom:6px}
.ktr .btn{justify-self:start}
@media(max-width:560px){.ktl{flex-direction:column;align-items:flex-start}.ktb{border-radius:6px 24px 24px 24px}}


/* Big tour vs us */
.vs{margin-top:44px;background:var(--card);border-radius:28px;padding:10px 22px}
.vs-h,.vs-r{display:grid;grid-template-columns:150px 1fr 1fr;gap:20px;padding-block:14px;border-bottom:1px solid var(--line);align-items:start}
.vs-r:last-child{border-bottom:0}
.vs-h b{font-weight:500;font-size:17px}
.vs-h .us{background:var(--lime);border-radius:999px;padding:4px 12px;justify-self:start}
.vs-h .them{color:var(--mute)}
.vs-r .k{font-weight:500;display:block}
.vs-r .them,.vs-r .us{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15.5px}
.vs-r .them{color:var(--mute)}
.vs-r .them i{color:var(--clay);display:grid;place-items:center;margin-top:2px}
.vs-r .us i{width:20px;height:20px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin-top:2px;color:var(--ink)}
.vs-r i svg{width:14px;height:14px}
@media(max-width:760px){.vs{padding:6px 18px}.vs-h{display:none}.vs-r{grid-template-columns:1fr;gap:8px}}
.moments3{display:grid;gap:12px;margin-top:14px}
@media(min-width:760px){.moments3{grid-template-columns:repeat(3,1fr)}}
.m3{margin:0;background:var(--card);border-radius:26px;padding:8px;display:grid;gap:10px;align-content:start}
.m3 img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px}
.m3 figcaption{padding:4px 10px 10px;display:grid;gap:4px}
.m3 b{font-weight:500;font-size:19px;letter-spacing:-.02em;line-height:1.2}
.m3 span{color:var(--mute);font-size:15px}
.note.center{text-align:center;margin-top:14px}


/* Phone menu (option A, Perk style): menu button under 960 px opens a white card from the bar; page behind blurs */
.mbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink);flex:0 0 auto}
.mbtn:hover{background:var(--tint)}
.mbtn path{transition:transform .25s cubic-bezier(.2,.7,.1,1);transform-origin:12px 12px}
.mbtn[aria-expanded="true"] .l1{transform:translateY(3px) rotate(45deg)}
.mbtn[aria-expanded="true"] .l2{transform:translateY(-3px) rotate(-45deg)}
@media(min-width:960px){.mbtn,.mmenu,.mscrim{display:none!important}}
header.top .wrap{position:relative}
.mmenu{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);background:var(--card);border-radius:28px;padding:8px 18px 18px;box-shadow:0 20px 50px rgba(20,20,15,.18);
 max-height:calc(100dvh - 132px);overflow:auto;display:grid;gap:8px;animation:mdrop .25s cubic-bezier(.2,.7,.1,1)}

.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:17px;padding:13px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}

.mrow svg{flex:0 0 auto;transition:transform .25s cubic-bezier(.2,.7,.1,1)}
.mrow[aria-expanded="true"] svg{transform:rotate(90deg)}
.msub{display:grid;gap:2px;padding:4px 0 10px 12px;border-bottom:1px solid var(--line)}
.msub a,.msub button{display:block;text-align:left;padding:9px 10px;border-radius:12px;font-size:15.5px;color:var(--ink);text-decoration:none}
.msub a:hover,.msub button:hover{background:var(--page)}
.mmenu .btn{width:100%;margin-top:6px}
.mutil{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);padding-top:6px}
.mseg{display:flex;background:var(--page);border-radius:999px;padding:3px}
.mseg button{padding:6px 12px;border-radius:999px;font-weight:500;font-size:13.5px}
.mseg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mscrim{position:fixed;inset:0;z-index:19;background:rgba(245,245,235,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:mfade .25s ease-out}
@keyframes mfade{from{opacity:0}to{opacity:1}}

.mbtn[aria-expanded="true"]{background:var(--tint);border-radius:14px}

 /* phones: at the top the hero has its own Plan my trip, so the bar shows the full logo and the menu button only.

 :root{--lkc:26px}
 .mark .lk{transition:height .3s cubic-bezier(.2,.7,.1,1)}
 body.bar-cta:not(.menu-open) .mark .lk{height:var(--lkc)!important}
 body.bar-cta .bar-nav .b-lime{min-height:38px;padding:0 13px;font-size:14px}
 body:not(.bar-cta) .bar-nav .b-lime,body.menu-open .bar-nav .b-lime{opacity:0;visibility:hidden}
}
@media(max-width:430px){:root{--lkc:22px}}
@media(max-width:375px){:root{--lkc:20px}body.bar-cta .bar-nav .b-lime{padding:0 11px;font-size:13px}}
@media(max-width:340px){:root{--lkc:18px}}
body.menu-open{overflow:hidden}
.msub[hidden],.mmenu[hidden],.mscrim[hidden]{display:none}
@media(max-width:430px){.mark .lk{height:28px!important}.bar-nav .b-lime{font-size:13.5px;padding:0 13px;min-height:40px}.bar-nav .b-lime svg{display:none}.mbtn{width:40px;height:40px}
 header.top.scrolled .bar-nav{margin-inline:-6px;padding:12px 12px 12px 16px}.bar-nav{gap:10px}}

@media(max-width:430px){.bar-nav{gap:8px}header.top.scrolled .bar-nav{margin-inline:-8px;padding:12px 10px 12px 14px}}
@media(max-width:375px){.mark .lk{height:25px!important}.bar-nav .b-lime{font-size:13px;padding:0 11px}.mbtn{width:38px;height:38px}}
@media(max-width:340px){.mark .lk{height:21px!important}.bar-nav{gap:5px;padding-right:0}.bar-nav .b-lime{min-height:38px}header.top.scrolled .bar-nav{padding:8px 4px 8px 10px}}
/* trip page: let the map and day list shrink to small phones */
.pkgrid>div{grid-template-columns:minmax(0,1fr)}

/* quiz mascot (Shape style leopard) */
.qsay{display:flex;gap:12px;align-items:flex-end}
.qleo{flex:0 0 auto;width:clamp(88px,20vw,124px)}
.qleo svg{display:block;width:100%;height:auto}
.qbub{background:var(--card);border-radius:24px 24px 24px 6px;padding:16px 20px;flex:1;min-width:0}
.qbub h2{font-size:clamp(24px,2.6vw,36px)}
.qbub p{margin-top:8px;color:var(--mute);font-size:16px}
@keyframes pop{0%{transform:scale(.88) rotate(-5deg)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:none}}
.qleo.pop{animation:pop .45s cubic-bezier(.2,.7,.1,1);transform-origin:50% 90%}
.result .lt{width:min(200px,60%);background:var(--page);border-radius:22px;justify-self:center}
.result .lt svg{display:block;width:100%;height:auto}
.result{text-align:center;justify-items:center}
.result p{color:#E8E8DE}
.pricecard{background:var(--card);border-radius:24px;padding:18px 20px}
.quiz input[type=text],.quiz input[type=tel]{background:var(--card)}


/* 404 page with Kotiya */
.lost{padding-block:48px 110px;display:grid;gap:28px;justify-items:center;text-align:center}
.lost .ltile{width:min(260px,70vw);background:var(--card);border-radius:28px;padding:14px}
.lost .ltile svg{display:block;width:100%;height:auto}
.lost .code{font:500 15px var(--f);color:var(--mute)}
.lost h1{font-size:clamp(36px,4.2vw,60px);max-width:14ch}
.lost .lead{margin-top:0}
.lost .help{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.lost .help a{background:var(--card);border-radius:999px;padding:10px 16px;text-decoration:none;font-size:15px}
.lost .help a:hover{background:var(--tint)}


/* Kotiya on the guest trip page: one tip + reacts to "How was today?" */
.ktip{background:var(--card);border-radius:24px;padding:14px;margin-top:20px;display:grid;gap:12px}
.ktip .row{display:flex;gap:12px;align-items:flex-end}
.ktip .kl{flex:0 0 auto;width:76px;background:var(--page);border-radius:18px;padding:4px}
.ktip .kl svg{display:block;width:100%;height:auto}
.ktip .kb{background:var(--page);border-radius:18px 18px 18px 5px;padding:12px 14px;font-size:15.5px;min-width:0}
.ktip .kb b{font-weight:500;display:block;margin-bottom:2px}
.ktip .plain{background:var(--page);border-radius:18px;padding:14px;font-size:15.5px}
.ktip .q{font-size:14px;color:var(--mute)}
.ktip .acts{margin-top:0}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}


/* booking confirmation: Kotiya celebrates on top, the receipt sits in its own card (no leopard beside money) */
.cf{display:grid;gap:16px}
.cf .row{display:flex;gap:12px;align-items:flex-end}
.cf .kl{position:relative;flex:0 0 auto;width:clamp(96px,26vw,128px);background:var(--page);border-radius:22px;padding:6px;overflow:hidden}
.cf .kl svg{display:block;width:100%;height:auto;position:relative}
.cf .kb{background:var(--page);border-radius:20px 20px 20px 6px;padding:14px 16px;min-width:0}
.cf .kb b{display:block;font:500 22px/1.15 var(--f);letter-spacing:-.02em}
.cf .kb .si{font-family:"Noto Sans Sinhala",var(--f);color:var(--mute);font-size:14px;margin-top:4px;display:block}
.cf h3{font-size:clamp(22px,2.2vw,28px)}
.cf ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:n}
.cf ol li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:n;font-size:15.5px}
.cf ol li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:600;font-size:13px;color:#14140F}
.cf ol small{display:block;color:var(--mute);font-size:13.5px}
.rcpt{border-radius:20px;box-shadow:inset 0 0 0 1px var(--sand);padding:14px 16px}
.rcpt table{width:100%;border-collapse:collapse;font-size:15px}
.rcpt td{padding:8px 0;border-bottom:1px solid var(--line)}
.rcpt td:last-child{text-align:right}
.rcpt tr:last-child td{border:0;font:500 20px var(--f);padding-top:12px}
.conf{position:absolute;width:8px;height:12px;border-radius:2px;top:-14px;opacity:0}
@media (prefers-reduced-motion: no-preference){.conf{animation:fall 1.3s cubic-bezier(.2,.7,.4,1) forwards}}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(130px) rotate(260deg)}}


/* Instagram story share card (9:16). Kotiya in Sticker style on a real photo. No prices on the card. */
.share{display:grid;gap:14px;justify-items:center}
.story{width:min(100%,330px,calc((90vh - 230px)*.5625));aspect-ratio:9/16;background:var(--lime);color:#14140F;border-radius:22px;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:6% 7% 7%;box-shadow:0 20px 50px rgba(20,20,15,.25);container-type:inline-size}
.story .wm{display:flex;align-items:center;gap:6px;font:600 5cqw/1 var(--f);letter-spacing:-.02em}
.story .wm .wmk{width:8cqw;height:8cqw;display:block}
.story .wm span{font-weight:400;opacity:.7}
.story .im{font:500 5.2cqw/1 var(--f);margin-top:9%}
.story h3{font:500 13.5cqw/.95 var(--f);letter-spacing:-.045em;margin-top:2%}
.story .ph2{position:relative;margin-top:7%;flex:1;min-height:0;border-radius:6cqw;overflow:visible}
.story .ph2 img{width:100%;height:100%;object-fit:cover;border-radius:6cqw;display:block}
.story .ph2 .stk{position:absolute;right:-6%;bottom:-9%;width:62%}
.story .ph2 .stk svg{display:block;width:100%;height:auto}
.story .rt{font-size:4.1cqw;line-height:1.35;margin-top:11%;max-width:62%}
.story .rt b{font-weight:500;display:block}
.story .cta{margin-top:5%;background:#14140F;color:#fff;border-radius:999px;padding:3.2cqw 4.5cqw;font:500 4.2cqw/1.1 var(--f);align-self:flex-start}
.story .cta small{display:block;font-weight:400;opacity:.75;font-size:3.4cqw;margin-top:1cqw}
.share .acts{width:100%;display:grid;gap:8px;margin-top:0}
.share .acts .btn{width:100%}


.stepx{font:500 13px var(--f);color:var(--mute);margin:0 0 6px}
.cardph{min-height:52px;border-radius:14px;background:var(--page);display:grid;place-items:center;color:var(--mute);font-size:14px;box-shadow:inset 0 0 0 1px var(--sand);border-style:dashed}
.linkb{color:var(--mute);text-decoration:underline;font-size:14px}
/* guest trip page */
.today{background:var(--card);border-radius:28px;padding:8px 20px}
.st{display:grid;grid-template-columns:38px 1fr;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.st:last-child{border:0}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;box-shadow:inset 0 0 0 1px var(--sand)}
.dot.v{background:var(--lime);box-shadow:none}
.st b{font-weight:500} .st small{color:var(--mute)}
.drv{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:14px;margin-top:12px}
.drv .av{width:54px;height:54px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:10px;color:var(--mute);text-align:center;flex:0 0 auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.b-help{box-shadow:inset 0 0 0 1.5px var(--clay);color:var(--clay)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.marq{overflow-x:auto}}
</style>

<script>/* MadeForSriLanka RouteMap: a real map (OpenStreetMap data via Protomaps, rendered by MapLibre) that draws any route from the places list.
   Needs: maplibregl, pmtiles, basemaps globals; files map/lka.wasm (map data), map/routes.json (places, routes, road legs), map/fonts/<font>/<range>.bin.
   Nothing is drawn by hand: a route is a list of place ids. */
window.RouteMap=(()=>{
  const base=new URL(".",location.href).href;
  let ready=null,DATA=null;
  class BufSource{constructor(buf){this.buf=buf}getKey(){return "lka"}async getBytes(o,l){return {data:this.buf.slice(o,o+l)}}}
  function init(){
    if(ready)return ready;
    ready=(async()=>{
      const [buf,data]=await Promise.all([fetch(base+"map/lka.wasm").then(r=>r.arrayBuffer()),fetch(base+"map/routes.json").then(r=>r.json())]);
      DATA=data;
      const protocol=new pmtiles.Protocol();protocol.add(new pmtiles.PMTiles(new BufSource(buf)));
      maplibregl.addProtocol("pmtiles",protocol.tile);
      return data})();
    return ready}
  function style(){
    const fl=Object.assign({},basemaps.namedFlavor("light"),{
      background:"#EEF1E6",earth:"#F5F5EB",water:"#BFD8DC",park_a:"#DCE8CC",park_b:"#D3E2C2",wood_a:"#D6E4C8",wood_b:"#CCDDBB",
      scrub_a:"#E3EBD5",scrub_b:"#DCE6CB",beach:"#F2E8CC",sand:"#F2E8CC",highway:"#FFFFFF",major:"#FFFFFF",
      ocean_label:"#5E8C92",city_label:"#3A3A32",city_label_halo:"#F5F5EB",subplace_label:"#6E6E64",state_label:"#9A9A8C"});
    const layers=JSON.parse(JSON.stringify(basemaps.layers("protomaps",fl,{lang:"en"}).filter(l=>!(l.layout&&l.layout["icon-image"]))).replace(/"Noto Sans (Regular|Medium|Italic)"/g,(m,w)=>'"noto-sans-'+w.toLowerCase()+'"'));
    return {version:8,glyphs:base+"map/fonts/{fontstack}/{range}.wasm",
      sources:{protomaps:{type:"vector",url:"pmtiles://lka",attribution:'<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a> · <a href="https://protomaps.com">Protomaps</a>'}},layers}}
  const fontFix=u=>({url:u.replace(/Noto%20Sans%20(Regular|Medium|Italic)/,(m,w)=>"noto-sans-"+w.toLowerCase())});
  function features(ids,visited){
    const P=DATA.places,loop=ids.length>1&&ids[0]===ids[ids.length-1],uniq=loop?ids.slice(0,-1):ids;
    const lineDone=[],lineTodo=[];
    for(let i=1;i<ids.length;i++){const leg=DATA.legs[ids[i-1]+"|"+ids[i]];const c=leg?leg.line:[[P[ids[i-1]][1],P[ids[i-1]][0]],[P[ids[i]][1],P[ids[i]][0]]];(i<=visited?lineDone:lineTodo).push(c)}
    return {
      route:{type:"FeatureCollection",features:[...lineTodo.map(c=>({type:"Feature",properties:{done:0},geometry:{type:"LineString",coordinates:c}})),...lineDone.map(c=>({type:"Feature",properties:{done:1},geometry:{type:"LineString",coordinates:c}}))]},
      stops:{type:"FeatureCollection",features:uniq.map((id,i)=>({type:"Feature",properties:{n:String(i+1),name:(DATA.names&&DATA.names[id])||id,done:i<visited?1:0},geometry:{type:"Point",coordinates:[P[id][1],P[id][0]]}}))}}}
  function bounds(ids){const P=DATA.places,b=new maplibregl.LngLatBounds();ids.forEach(id=>b.extend([P[id][1],P[id][0]]));return b}
  // mount(el, ids, {visited, interactive}) -> {set(ids,visited), focus(i), map}
  async function mount(el,ids,o={}){
    await init();
    const map=new maplibregl.Map({container:el,style:style(),bounds:bounds(ids),fitBoundsOptions:{padding:48},attributionControl:{compact:true},
      dragRotate:false,pitchWithRotate:false,cooperativeGestures:o.cooperative!==false,maxBounds:[[78.6,5.2],[82.9,10.3]],minZoom:6});
    map.touchZoomRotate.disableRotation();
    if(o.interactive!==false)map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
    let cur={ids,visited:o.visited||0};
    map.on("load",()=>{
      const f=features(cur.ids,cur.visited);
      map.addSource("route",{type:"geojson",data:f.route});map.addSource("stops",{type:"geojson",data:f.stops});
      map.addLayer({id:"route-case",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#14140F","line-width":7,"line-opacity":o.mode==="trip"?["case",["==",["get","done"],1],0.9,0.5]:0.85}});
      map.addLayer({id:"route",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":o.mode==="trip"?["case",["==",["get","done"],1],"#BEFF50","#FFFFFF"]:"#BEFF50","line-width":3.8}});
      map.addLayer({id:"stop",type:"circle",source:"stops",paint:{"circle-radius":11,"circle-color":["case",["==",["get","done"],1],"#BEFF50","#FFFFFF"],"circle-stroke-color":"#14140F","circle-stroke-width":2}});
      map.addLayer({id:"stop-n",type:"symbol",source:"stops",layout:{"text-field":["get","n"],"text-font":["noto-sans-medium"],"text-size":11.5,"text-allow-overlap":true,"text-ignore-placement":true},paint:{"text-color":"#14140F"}});
      map.addLayer({id:"stop-name",type:"symbol",source:"stops",layout:{"text-field":["get","name"],"text-font":["noto-sans-medium"],"text-size":13.5,"text-variable-anchor":["left","right","top","bottom"],"text-radial-offset":1.25,"text-justify":"auto"},paint:{"text-color":"#14140F","text-halo-color":"#FFFFFF","text-halo-width":2}});
      if(o.onStop){map.on("click","stop",e=>o.onStop(+e.features[0].properties.n-1));map.on("mouseenter","stop",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","stop",()=>map.getCanvas().style.cursor="")}
    });
    return {map,
      set(ids2,visited2=0){cur={ids:ids2,visited:visited2};const f=features(ids2,visited2);const go=()=>{map.getSource("route").setData(f.route);map.getSource("stops").setData(f.stops);map.fitBounds(bounds(ids2),{padding:48,duration:matchMedia("(prefers-reduced-motion: reduce)").matches?0:800})};map.loaded()&&map.getSource("route")?go():map.once("load",go)},
      focus(i){const id=(cur.ids[i]);if(!id)return;const P=DATA.places[id];map.flyTo({center:[P[1],P[0]],zoom:Math.max(map.getZoom(),9.5),duration:matchMedia("(prefers-reduced-motion: reduce)").matches?0:900})},
      fit(){map.fitBounds(bounds(cur.ids),{padding:48})}}}
  function legInfo(a,b){return DATA&&DATA.legs[a+"|"+b]}
  function gmaps(ids){const P=DATA.places,ll=id=>P[id][0]+","+P[id][1],w=ids.slice(1,-1).map(ll).join("|");return `https://www.google.com/maps/dir/?api=1&origin=${ll(ids[0])}&destination=${ll(ids[ids.length-1])}${w?`&waypoints=${encodeURIComponent(w)}`:""}&travelmode=driving`}
  return {init,mount,legInfo,gmaps,data:()=>DATA}})();
</script>

function island(visited,focus){const pts=STOPS.map(s=>`${s.x},${s.y}`).join(" "),vis=STOPS.slice(0,visited+1).map(s=>`${s.x},${s.y}`).join(" ");
 return `<svg viewBox="0 0 280 370" role="img" aria-label="Route map of Sri Lanka">
  <path d="M120 22c30 8 62 54 84 106s38 112 22 156-60 58-96 40S40 270 36 210 66 10 120 22z" fill="#2F4A2A"/>
  <polyline points="${pts}" fill="none" stroke="#D2D2C8" stroke-width="1.6" stroke-dasharray="3 6" stroke-linecap="round"/>
  ${visited>0?`<polyline points="${vis}" fill="none" stroke="#BEFF50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`:""}
  ${STOPS.map((s,i)=>{const on=focus===null||focus===i,v=i<visited;return `<g class="stopbtn" data-stop="${i}" tabindex="0" role="button" aria-label="${s.n}, ${s.d}" opacity="${on?1:.3}">
   <circle cx="${s.x}" cy="${s.y}" r="${focus===i?16:13}" fill="${v?"#BEFF50":"#FFFFFF"}"/>
   <text x="${s.x}" y="${s.y+4.5}" text-anchor="middle" font-family="Onest" font-weight="600" font-size="12" fill="#14140F">${i+1}</text>
   <text x="${s.x+(s.x>180?-21:21)}" y="${s.y+4}" text-anchor="${s.x>180?"end":"start"}" font-family="Onest" font-weight="500" font-size="13" fill="#14140F" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${s.n}</text></g>`}).join("")}</svg>`}

function pkg(){steps(1);const p=price(S.pk);
 app.innerHTML=`<section class="pkhead"><div class="wrap"><h1>The Classic</h1><p class="lead">7 nights, private. Leopards, tea hills, a palace on a rock and the south coast. Tap a stop to see its day. Change any of it, even on the road.</p>
  <div class="stats num"><div><b>7</b><span>nights</span></div><div><b>6</b><span>stops on the map</span></div><div><b>1</b><span>driver, the whole trip</span></div><div><b>24/7</b><span>help on WhatsApp</span></div></div></div></section>
 <div class="wrap pkgrid"><div style="display:grid;gap:14px;min-width:0">
  <div class="mapbox real" id="map"><div class="rm" id="rm" role="region" aria-label="Route map of The Classic"></div></div>
  <div class="days">${STOPS.map((s,i)=>`<article class="day ${S.focus===null||S.focus===i?"":"dim"}" id="day${i}">
   <div class="meta"><span>${s.d} · ${s.n}</span>${i?`<span class="legkm" data-leg="${i}"></span>`:""}<span class="eff ${s.e==="Hard"?"hard":""}">${s.e}</span></div>
   <h3>${s.t}</h3><details><summary>See details</summary><p style="margin-top:6px">${s.w}. Drive times, what's included and the rain plan live here.</p></details>
   ${i===2?'<div><button class="btn b-ol" data-swap>Swap this day for a beach day</button></div>':""}</article>`).join("")}</div>
 </div><aside class="panel" id="side">${panel()}</aside></div>
 <div class="bar pk"><div><div class="tot num" id="tot">${usd(p.total)}</div><small id="tn">for ${S.pk.people} · ${S.pk.level} · sample</small></div><button class="btn b-lime b-lg" data-sheet>Make it yours and book</button></div>${waBtn(true,"onbar")}`}
function panel(){const P=S.pk,p=price(P),seg=(k,o)=>`<div class="opts">${o.map(v=>`<button class="opt" data-set="${k}" data-val="${v}" aria-pressed="${P[k]===v}">${v}</button>`).join("")}</div>`;
 return `<h3>Make it yours</h3>
 <div class="fld"><span class="lb">Who's coming</span><div class="stp"><button data-ppl="-1" aria-label="One fewer">−</button><output class="num">${P.people}</output><button data-ppl="1" aria-label="One more">+</button></div></div>
 <div class="fld"><span class="lb">Style</span>${seg("style",["Couple","Family","Honeymoon"])}</div>
 <div class="fld"><span class="lb">Hotels</span>${seg("level",["Comfort","Boutique","Luxury"])}</div>

 nav.innerHTML=row("trips","Trips","4 round trips · design your own")+row("day","Day trips","From your hotel on the coast")+link("How it works","",'href="#home" data-mscroll="how"')+row("guides","Guides","Places and planning")+link("Our crew","",'href="#home" data-mscroll="crew"')+link("My trip","Already booked? Open your trip page",'href="#my-trip"')
  +`<button class="btn b-lime b-lg" data-go="plan">Plan my trip ${chev}</button><button class="btn b-ol b-lg" data-done="Opens WhatsApp. A real person from our crew answers, not a bot.">${chat}WhatsApp us</button>
  <div class="mutil"><span class="mseg" role="group" aria-label="Language"><button aria-pressed="true">EN</button><button aria-pressed="false" data-done="The German site opens here (twin pages, /de).">DE</button></span><span>USD</span></div>`;
 const set=o=>{btn.setAttribute("aria-expanded",o);btn.setAttribute("aria-label",o?"Close menu":"Open menu");nav.hidden=!o;scrim.hidden=!o;document.body.classList.toggle("menu-open",o);if(o){const f=nav.querySelector(".mrow");f&&f.focus()}};
 window.closeMenu=()=>set(false);
 btn.addEventListener("click",()=>set(nav.hidden));scrim.addEventListener("click",()=>set(false));
 addEventListener("keydown",e=>{if(e.key==="Escape"&&!nav.hidden){set(false);btn.focus()}});
 addEventListener("resize",()=>{if(innerWidth>=960&&!nav.hidden)set(false)});
 addEventListener("hashchange",()=>set(false));

  const sc=e.target.closest("[data-mscroll]");if(sc){e.preventDefault();set(false);const id=sc.dataset.mscroll,j=()=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};if((location.hash||"#home")!=="#home"){location.hash="home";setTimeout(j,80)}else j();return}
  const g=e.target.closest("[data-mguide]");if(g){set(false);toast("The "+g.dataset.mguide+" guide opens here.");e.stopPropagation();return}
  if(e.target.closest("a[href^='#'],[data-go]"))set(false)},true);
 nav.addEventListener("click",e=>{const b=e.target.closest("[data-mbook]");if(b){set(false);location.hash!=="#home"&&(location.hash="home");setTimeout(()=>book(b.dataset.mbook),60)}});
})();

const CLASSIC=["airport","sigiriya","kandy","ella","yala","galle"];let RMAP=null;

 if(d.go)return go(d.go);if(d.scroll)return document.getElementById(d.scroll).scrollIntoView({behavior:"smooth"});if("close" in d)return close();

 if(d.pay)return payStep(d.pay);

 if("share" in d)return shareCard();
 if(d.fb){S.fb=d.fb;$("#ktip").innerHTML=ktip();return}
 if(d.done)return toast(d.done);
 const nm=(layer.dataset.kind||"").slice(5);if(d.bd){S.b.date=+d.bd;return book(nm)}if(d.bz){S.b.zone=d.bz;return book(nm)}if(d.ba){S.b.adults=+d.ba;return book(nm)}
 const q=S.q;if(d.q){q[d.q]=+d.v;return quiz()}
 if(d.reg){const i=q.reg.indexOf(d.reg);i>-1?q.reg.splice(i,1):q.reg.push(d.reg);return quiz()}
 if(d.type){const i=q.types.indexOf(d.type);if(i>-1)q.types.splice(i,1);else if(q.types.length<3)q.types.push(d.type);return quiz()}
 if("qback" in d){if(q.step>0){q.step--;quiz()}else go("home");return}
 if("qnext" in d){if(q.step<Q.length-1){q.step++;quiz()}else toast("Your full plan arrives within 24 hours as a private trip page.");return}});
