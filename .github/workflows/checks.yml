name: checks

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  docs-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync audit
        run: node scripts/audit.mjs
      - name: Design-system copy
        run: node scripts/sync-design-copy.mjs --check
      - name: Skills index
        run: node scripts/skills-index.mjs --check

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sns_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sns_test
    steps:
      - uses: actions/checkout@v4
      - name: Is there an app yet?
        id: app
        run: echo "present=$([ -f app/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install, types, lint, tests, AT coverage, build
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run test:at-coverage
          npm run build
      - name: Browser journeys (Chromium, desktop and phone sizes)
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
