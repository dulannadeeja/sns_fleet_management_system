# Test database for the rule tests (TRD › Testing). Start: npm run db:test:up · stop: npm run db:test:down
name: sns-test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sns_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sns_test"]
      interval: 2s
      timeout: 3s
      retries: 30
