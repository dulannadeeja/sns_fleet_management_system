    <main style="padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 32px; max-width: 1600px; width: 100%; margin: 0 auto; box-sizing: border-box">

      <x-import component-from-global-scope="Plate.AttentionBar" items="{{attention}}"></x-import>

      <section style="display: flex; flex-direction: column; gap: 14px">

        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
          <x-import component-from-global-scope="Plate.MoneyBlock" label="අද ලැබුණු මුදල් · Money received" icon="wallet" state="මේ වෙනකම් · so far today — cash, bank and card are shown separately" note="Includes deposits received, as their own line. Not SNS earnings."></x-import>

          <x-import component-from-global-scope="Plate.MoneyBlock" label="ගැලපීම · Bank &amp; card check" icon="link" state="තවම බැලුවේ නැහැ · not yet checked" note="Recorded payments count as paid now; the check happens at day end."></x-import>

          <x-import component-from-global-scope="Plate.MoneyBlock" label="Partner ට ගන්න පුළුවන් · Partners can cash out" icon="handshake" figure="{{payable}}" note="Final at the end of each day. Partners ask in their app; SNS pays and records it."></x-import>

          <x-import component-from-global-scope="Plate.MoneyBlock" label="SNS ආදායම · SNS earnings" icon="chart" state="Month to date" note="SNS cars’ rent plus SNS’s commission and shares on partner cars; profit is shown before depreciation. The sample data has no month total."></x-import>

      </section>

      <section style="display: flex; flex-direction: column; gap: 16px">

        <x-import component-from-global-scope="Plate.FleetStrip" cars="{{fleet}}" hrefs="{{fleetHrefs}}"></x-import>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 8px">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
              <x-import component-from-global-scope="Plate.StatusChip" status="{{g.status}}" lang="si"></x-import>
              <span class="rt-num" style="font-family: var(--font-plate); font-size: 22px; line-height: 28px; font-weight: 600">{{g.count}}</span>
              <span style="font-size: 15px; line-height: 24px; color: var(--ink-muted)">{{g.hint}}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px">
              <sc-for list="{{g.cars}}" as="c" hint-placeholder-count="5">
                <x-import component-from-global-scope="Plate.VehicleCard" plate="{{c.plate}}" model="{{c.model}}" body="{{c.body}}" status="{{c.status}}" status-detail="{{c.detail}}" next="{{c.next}}" partner="{{c.partner}}" partner-name="{{c.partnerName}}" warning="{{c.warning}}" lang="si"></x-import>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </section>

      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 600">ඉදිරි වැඩ <span class="rt-en">· Coming up</span></h2>
        <div style="display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">
          <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="5">
            <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line)">
              <span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--sunken); color: var(--ink)"><x-import component-from-global-scope="Plate.Icon" name="{{u.icon}}" size="{{twenty}}"></x-import></span>
              <span style="font-size: 16px; line-height: 26px; font-weight: 600">{{u.title}}</span>
              <span style="font-size: 15px; line-height: 24px; color: var(--ink-muted)">{{u.detail}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
